<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Being Adult &#x2014; Bill Invite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #140025;
      color: #E8D4FF;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    .coin { margin-bottom: 24px; }
    .coin img { width: 72px; height: 72px; }
    h1 {
      font-size: 20px;
      color: #FFD700;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 11px;
      color: #7B5E8A;
      letter-spacing: 2px;
      margin-bottom: 40px;
    }
    .card {
      background: #1E0040;
      border: 2px solid #9B59B6;
      border-bottom: 4px solid #B8860B;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 32px;
      text-align: center;
    }
    .bill-icon { margin-bottom: 12px; }
    .bill-icon img { width: 52px; height: 52px; }
    .bill-name {
      font-size: 14px;
      color: #E8D4FF;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .bill-amount {
      font-size: 22px;
      color: #FFD700;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .bill-rec {
      font-size: 10px;
      color: #9B59B6;
      letter-spacing: 2px;
    }
    .btn {
      display: block;
      background: #FFD700;
      color: #140025;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
      padding: 16px 24px;
      border: none;
      border-bottom: 4px solid #B8860B;
      width: 100%;
      max-width: 360px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .btn-store {
      background: #1E0040;
      color: #FFD700;
      border: 2px solid #9B59B6;
      border-bottom: 4px solid #B8860B;
    }
    .msg {
      font-size: 10px;
      color: #7B5E8A;
      text-align: center;
      letter-spacing: 1px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="coin">
    <img src="https://cdn.jsdelivr.net/npm/twemoji@14/assets/svg/1f4b0.svg" alt="coin" />
  </div>
  <h1>BEING ADULT</h1>
  <p class="sub">BILL REMINDER APP</p>

  <div class="card" id="bill-card" style="display:none">
    <div class="bill-icon" id="b-icon"></div>
    <div class="bill-name" id="b-name">...</div>
    <div class="bill-amount" id="b-amount">...</div>
    <div class="bill-rec" id="b-rec">...</div>
  </div>

  <a class="btn" id="open-btn" href="#">OPEN IN BEING ADULT</a>
  <a class="btn btn-store" id="store-btn"
     href="https://play.google.com/store/apps/details?id=com.example.being_adult">
    GET THE APP &#x2014; PLAY STORE
  </a>
  <p class="msg" id="status-msg">Opening app...</p>

  <script>
    function emojiToUrl(emoji) {
      const pts = [...emoji]
        .map(c => c.codePointAt(0).toString(16))
        .filter(p => parseInt(p, 16) !== 0xfe0f);
      return 'https://cdn.jsdelivr.net/npm/twemoji@14/assets/svg/' + pts.join('-') + '.svg';
    }

    const params = new URLSearchParams(window.location.search);
    const raw = params.get('data');

    let bill = null;
    if (raw) {
      try {
        bill = JSON.parse(atob(raw.replace(/-/g, '+').replace(/_/g, '/')));
      } catch (e) {}
    }

    if (bill) {
      const icon = bill.i || '';
      if (icon) {
        const img = document.createElement('img');
        img.src = emojiToUrl(icon);
        img.alt = icon;
        document.getElementById('b-icon').appendChild(img);
      }
      document.getElementById('b-name').textContent   = (bill.n || 'Bill').toUpperCase();
      document.getElementById('b-amount').textContent = bill.a || '';
      document.getElementById('b-rec').textContent    = (bill.r || '').toUpperCase();
      document.getElementById('bill-card').style.display = 'block';
    }

    const deepLink = 'beingadult://import' + window.location.search;
    document.getElementById('open-btn').href = deepLink;

    let opened = false;
    document.getElementById('open-btn').addEventListener('click', function(e) {
      e.preventDefault();
      opened = true;
      window.location.href = deepLink;
      setTimeout(() => {
        if (document.visibilityState !== 'hidden') {
          document.getElementById('status-msg').textContent =
            'App not found — get it on the Play Store below.';
        }
      }, 1800);
    });

    setTimeout(() => {
      if (!opened) {
        window.location.href = deepLink;
        setTimeout(() => {
          document.getElementById('status-msg').textContent =
            "Tap 'Open in Being Adult' or get the app below.";
        }, 1800);
      }
    }, 400);
  </script>
</body>
</html>
